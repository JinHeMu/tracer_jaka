force_admittance_servo:
  ros__parameters:

    # ── 话题配置 ──────────────────────────────────────────────────────────────
    wrench_topic: "/jaka_fts_broadcaster/wrench"

    servo_twist_topic: "/servo_node/delta_twist_cmds"

    enable_topic: "~/enable"

    # MoveIt Servo 接收 TwistStamped 时使用的 frame_id
    # 必须和 Servo 配置里的 robot_link_command_frame 对齐
    control_frame_id: "base_link"

    # 末端工具坐标系，必须在 TF 树里真实存在
    # 可用命令检查：
    # ros2 run tf2_ros tf2_echo base_link gripper_center_link
    ee_frame_id: "gripper_center_link"

    # ── 控制频率 ──────────────────────────────────────────────────────────────
    control_rate: 125.0

    # ── 每轴控制模式 ──────────────────────────────────────────────────────────
    # 顺序：[x, y, z, rx, ry, rz]
    #   0 = DISABLED
    #   1 = ADMITTANCE
    #   2 = FORCE_CONTROL
    #
    # 这里是：XY导纳，Z恒力PI，旋转禁用
    axis_mode: [1, 1, 2, 0, 0, 0]

    # ── 动力学参数 ────────────────────────────────────────────────────────────
    # XY导纳会用到 mass/damping/stiffness
    # Z轴现在使用 PI 控制，不再使用 mass/damping/stiffness 计算恒力速度
    mass: [10.0, 10.0, 10.0, 0.025, 0.025, 0.025]

    damping: [20.0, 20.0, 50.0, 0.25, 0.25, 0.25]

    stiffness: [100.0, 100.0, 0.0, 0.0, 0.0, 0.0]

    # ── 恒力目标 ─────────────────────────────────────────────────────────────
    # 顺序：[fx, fy, fz, tx, ty, tz]
    #
    # 符号约定：
    #   force_error = target_wrench[2] + F_measured[2]
    #   平衡时：target_wrench[2] + F_measured[2] = 0
    #
    # 例如 target_wrench[2] = 2.0，则期望测得 F_measured[2] = -2.0
    target_wrench: [0.0, 0.0, 2.0, 0.0, 0.0, 0.0]

    # ── z轴恒力 PI 控制参数 ─────────────────────────────────────────────────
    # vz = z_force_kp * force_error + z_force_ki * integral(force_error)
    #
    # 建议调试时先把 z_force_ki 设为 0，只调 P；
    # P 方向正确且基本稳定后，再逐渐增加 I。
    z_force_kp: 0.012 
    z_force_ki: 0.001
    z_force_integral_limit: 10.0
    # ── 速度输出限幅 ──────────────────────────────────────────────────────────
    # 恒力接触控制建议先保守，不建议一开始用 1.5 m/s
    max_linear_vel: 1.4
    max_angular_vel: 2.0

    max_linear_accel: 2.0
    max_angular_accel: 4.0
