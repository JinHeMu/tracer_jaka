# Topics referenced by jaka_lerobot_bridge.
# This file is documentation only — the actual topic names live in
# jaka_lerobot_bridge/common.py (ROS side) and offline/bag_to_lerobot.py
# (LeRobot side). Keep them in sync.

recorded_topics:
  - name: /joint_states
    type: sensor_msgs/msg/JointState
    purpose: observation.state (arm + gripper finger angle)

  - name: /jaka_arm_servo_controller/commands
    type: std_msgs/msg/Float64MultiArray
    purpose: action (target arm joint positions written by MoveIt Servo)

  - name: /gripper/state
    type: dh_gripper_driver/msg/GripperState
    purpose: observation (gripper opening in mm), used for sanity checks

  - name: /gripper/ctrl
    type: dh_gripper_driver/msg/GripperCtrl
    purpose: action (target gripper opening + force + speed)

  - name: /camera_scene/color/image_raw/compressed
    type: sensor_msgs/msg/CompressedImage
    purpose: observation.images.scene_cam

  - name: /camera_wrist/color/image_raw/compressed
    type: sensor_msgs/msg/CompressedImage
    purpose: observation.images.wrist_cam

# These topics are NOT recorded, but the policy_bridge_node consumes /joy
# from a teleop joystick to e.g. trigger episode resets if you extend it.
control_topics:
  - name: /joy
    type: sensor_msgs/msg/Joy
