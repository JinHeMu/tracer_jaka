# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 125  # Hz

    jaka_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    jaka_fts_broadcaster:
      type: force_torque_sensor_broadcaster/ForceTorqueSensorBroadcaster

jaka_arm_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
      - effort

jaka_fts_broadcaster:
  ros__parameters:
    sensor_name: tcp_fts_sensor

    frame_id: jk_se_vi_200_link
    interface_names:
      force:
        x: force.x
        y: force.y
        z: force.z
      torque:
        x: torque.x
        y: torque.y
        z: torque.z