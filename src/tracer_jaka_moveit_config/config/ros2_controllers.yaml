# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 125  # Hz

    jaka_arm_controller:
      type: forward_command_controller/ForwardCommandController
    # jaka_arm_controller:
    #   type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    jaka_fts_broadcaster:
      type: force_torque_sensor_broadcaster/ForceTorqueSensorBroadcaster

    jaka_admittance_controller:
      type: admittance_controller/AdmittanceController



jaka_arm_controller:
  ros__parameters:
    joints:
      - jaka_admittance_controller/joint_1
      - jaka_admittance_controller/joint_2
      - jaka_admittance_controller/joint_3
      - jaka_admittance_controller/joint_4
      - jaka_admittance_controller/joint_5
      - jaka_admittance_controller/joint_6
    interface_name: position

# jaka_arm_controller:
#   ros__parameters:
#     joints:
#       - joint_1
#       - joint_2
#       - joint_3
#       - joint_4
#       - joint_5
#       - joint_6
#         # 1. 接口配置
#     command_interfaces:
